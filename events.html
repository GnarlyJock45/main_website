<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0C1B2E">
  <title>الفعاليات | عزوة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand" aria-label="عزوة">
        <img class="brand-logo" src="images/logo-dark.png" alt="عزوة AZWA">
      </div>
      <div class="header-actions">
        <button class="icon-btn" aria-label="الإشعارات">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 1112 0c0 4 2 5 2 7H4c0-2 2-3 2-7z"/><path d="M10 20a2 2 0 004 0"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="main">
      <div class="page-title">
        <button class="icon-btn" aria-label="بحث">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
          </svg>
        </button>
        <h1>الفعاليات</h1>
        <div class="actions">
          <button class="icon-btn" aria-label="تصفية">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16M4 12h10M4 18h16"/><circle cx="17" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>
            </svg>
          </button>
        </div>
      </div>

      <div style="padding:0 20px 8px">
        <div class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
          </svg>
          <input type="search" placeholder="وش ودك تسوي اليوم؟" data-events-search aria-label="بحث">
        </div>
      </div>

      <div class="filters">
        <div class="chip-row" role="tablist" aria-label="التصنيفات">
          <button class="chip" data-filter-cat="all">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
            الكل
          </button>
          <button class="chip" data-filter-cat="food">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v6a3 3 0 006 0V3M7 9v12M15 3c-1.5 1-3 3-3 6s1 5 3 5v7"/></svg>
            مطاعم
          </button>
          <button class="chip" data-filter-cat="sport">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>
            رياضة
          </button>
          <button class="chip" data-filter-cat="themepark">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4v16"/></svg>
            ترفيه
          </button>
          <button class="chip" data-filter-cat="cinema">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M3 8l3-4h4l-3 4M11 8l3-4h4l-3 4"/></svg>
            سينما
          </button>
          <button class="chip" data-filter-cat="games">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="12" rx="4"/><path d="M6 12h4M8 10v4"/><circle cx="16" cy="12" r="1"/><circle cx="18" cy="14" r="1"/></svg>
            ألعاب
          </button>
          <button class="chip" data-filter-cat="experience">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5z"/></svg>
            تجارب
          </button>
        </div>
      </div>

      <section class="section" style="padding-top:8px">
        <div class="section-head">
          <h2>الباقات</h2>
          <span class="link" style="opacity:.7;cursor:default">بأسعار أفضل</span>
        </div>
        <div class="event-scroller" data-render="packages"></div>
      </section>

      <section class="section" style="padding-top:8px">
        <div class="section-head">
          <h2>الأكثر رواجاً</h2>
          <a class="link" href="#">عرض الكل</a>
        </div>
        <div class="event-list" data-render="events-list"></div>
      </section>

      <section class="section" style="padding-top:0">
        <div class="section-head">
          <h2>فعاليات هذا الأسبوع</h2>
          <a class="link" href="#">عرض الكل</a>
        </div>
        <div class="event-scroller" data-render="week-strip"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="التنقل">
      <a class="nav-item" href="index.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2h-5v-6h-4v6H5a2 2 0 01-2-2V10z"/></svg></span>
        <span>الرئيسية</span>
      </a>
      <a class="nav-item" href="calendar.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span>
        <span>التقويم</span>
      </a>
      <a class="nav-item" href="cards.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span>
        <span>البطاقات</span>
      </a>
      <a class="nav-item" href="events.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a2 2 0 012-2h14a2 2 0 012 2v2a2 2 0 100 4v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2a2 2 0 100-4z"/><path d="M12 6v12" stroke-dasharray="2 3"/></svg></span>
        <span>الفعاليات</span>
      </a>
      <a class="nav-item" href="more.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span>
        <span>المزيد</span>
      </a>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
