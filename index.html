<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0C1B2E">
  <title>عزوة | AZWA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <!-- Header (dark on home) -->
    <header class="app-header app-header--dark">
      <div class="brand" aria-label="عزوة">
        <span class="brand-icon" role="img" aria-label="عزوة"></span>
        <span class="brand-text"><b>عزوة</b><small>AZWA</small></span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" aria-label="الإشعارات">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 1112 0c0 4 2 5 2 7H4c0-2 2-3 2-7z"/><path d="M10 20a2 2 0 004 0"/>
          </svg>
          <span class="badge-dot"></span>
        </button>
      </div>
    </header>

    <main class="main">
      <!-- Hero -->
      <section class="hero" aria-labelledby="hi">
        <div class="greet">
          <div>
            <div class="hi" id="hi">مرحباً <span data-bind="user-first">أحمد</span> </div>
            <div class="sub">اكتشف فعاليات الرياض واستفد من نقاطك</div>
          </div>
        </div>

        <!-- Azwa payment card with overlaid balance/points/recharge -->
        <div class="azwa-card" role="img" aria-label="بطاقة عزوة">
          <img class="card-art" src="images/azwa-card.png" alt="">
          <div class="card-overlay">
            <div class="card-top">
              <span class="card-label">رصيد عزوة</span>
            </div>
            <div class="card-balance" data-bind="balance">1,280.50 <small>ر.س</small></div>
            <div class="card-footer">
              <div class="card-points">
                <span class="k">نقاطك المتاحة</span>
                <span class="v" data-bind="points-line">2,450 نقطة</span>
              </div>
              <button class="card-recharge" data-open="recharge" aria-label="شحن الرصيد">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                <span>شحن الرصيد</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Popular events -->
      <section class="section">
        <div class="section-head">
          <h2>مقترح لك</h2>
          <a class="link" href="events.html">عرض الكل</a>
        </div>
        <div class="event-scroller" data-render="popular"></div>
      </section>

      <!-- Promo -->
      <div class="promo" role="button" tabindex="0">
        <div class="gift">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M20 12v9H4v-9M7 8a2.5 2.5 0 010-5C10 3 12 8 12 8s2-5 5-5a2.5 2.5 0 010 5"/></svg>
        </div>
        <div>
          <div class="title">3X نقاط هذا الأسبوع!</div>
          <div class="desc">استخدم بطاقتك في السينما والمطاعم حتى 20 يوليو</div>
        </div>
        <span class="go">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </span>
      </div>

      <!-- Nearby categories -->
      <section class="section">
        <div class="section-head">
          <h2>بالقرب منك</h2>
          <a class="link" href="map.html">عرض الكل</a>
        </div>
        <div class="cat-grid" data-render="nearby-cats"></div>
        <div class="empty" style="padding:12px 4px 0;font-size:11px">المسافات تقريبية لأغراض العرض</div>
      </section>
    </main>

    <!-- Bottom nav -->
    <nav class="bottom-nav" aria-label="التنقل">
      <a class="nav-item" href="index.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2h-5v-6h-4v6H5a2 2 0 01-2-2V10z"/></svg></span>
        <span>الرئيسية</span>
      </a>
      <a class="nav-item" href="calendar.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span>
        <span>التقويم</span>
      </a>
      <a class="nav-item" href="map.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
        <span>الخريطة</span>
      </a>
      <a class="nav-item" href="events.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a2 2 0 012-2h14a2 2 0 012 2v2a2 2 0 100 4v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2a2 2 0 100-4z"/><path d="M12 6v12" stroke-dasharray="2 3"/></svg></span>
        <span>الفعاليات</span>
      </a>
      <a class="nav-item" href="more.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span>
        <span>المزيد</span>
      </a>
    </nav>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
