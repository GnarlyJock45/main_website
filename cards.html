<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0C1B2E">
  <title>بطاقاتي | عزوة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand" aria-label="عزوة">
        <img class="brand-logo" src="images/logo-dark.png" alt="عزوة AZWA">
      </div>
      <div class="header-actions">
        <button class="icon-btn" aria-label="الإشعارات">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 1112 0c0 4 2 5 2 7H4c0-2 2-3 2-7z"/><path d="M10 20a2 2 0 004 0"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="main">
      <div class="page-title">
        <h1>بطاقاتي</h1>
      </div>

      <p class="empty" style="padding:0 20px 8px;text-align:start;font-size:12px">
        تشترك جميع بطاقاتك في رصيد ونقاط حساب واحد.
      </p>

      <section class="section" style="padding-top:8px">
        <div class="card-list" data-render="cards"></div>
      </section>

      <section class="section">
        <div class="menu-list">
          <button class="menu-row" data-open="link-card">
            <span class="ic-wrap">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </span>
            <span>ربط بطاقة جديدة</span>
            <span></span>
            <span class="chev">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </span>
          </button>
          <button class="menu-row" data-open="recharge">
            <span class="ic-wrap">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M20 12v9H4v-9"/></svg>
            </span>
            <span>شحن الرصيد</span>
            <span data-bind="balance-inline" style="font-size:12px;color:var(--ink-3)">0 ر.س</span>
            <span class="chev">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </span>
          </button>
          <a class="menu-row" href="more.html">
            <span class="ic-wrap">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
            </span>
            <span>سجل المعاملات</span>
            <span></span>
            <span class="chev">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </span>
          </a>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="التنقل">
      <a class="nav-item" href="index.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2h-5v-6h-4v6H5a2 2 0 01-2-2V10z"/></svg></span>
        <span>الرئيسية</span>
      </a>
      <a class="nav-item" href="calendar.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span>
        <span>التقويم</span>
      </a>
      <a class="nav-item" href="cards.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span>
        <span>البطاقات</span>
      </a>
      <a class="nav-item" href="events.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a2 2 0 012-2h14a2 2 0 012 2v2a2 2 0 100 4v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2a2 2 0 100-4z"/><path d="M12 6v12" stroke-dasharray="2 3"/></svg></span>
        <span>الفعاليات</span>
      </a>
      <a class="nav-item" href="more.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span>
        <span>المزيد</span>
      </a>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
