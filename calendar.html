<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0C1B2E">
  <title>التقويم | عزوة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand" aria-label="عزوة">
        <img class="brand-logo" src="images/logo-dark.png" alt="عزوة AZWA">
      </div>
      <div class="header-actions">
        <button class="icon-btn" aria-label="الإشعارات">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 1112 0c0 4 2 5 2 7H4c0-2 2-3 2-7z"/><path d="M10 20a2 2 0 004 0"/>
          </svg>
          <span class="badge-dot"></span>
        </button>
      </div>
    </header>

    <main class="main">
      <div class="page-title">
        <button class="icon-btn" aria-label="تصفية">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16l-6 8v6l-4 2v-8L4 4z"/>
          </svg>
        </button>
        <h1>التقويم</h1>
        <div class="actions">
          <button class="icon-btn" aria-label="اليوم">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="cal-card" data-render="calendar"></div>

      <div class="upcoming">
        <span class="ic-wrap">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>
          </svg>
        </span>
        <div>
          <div class="title">فعالياتك القادمة</div>
          <div class="desc">اختر موعدك القادم في الرياض</div>
        </div>
        <a href="events.html" class="link">عرض الكل</a>
      </div>

      <div class="section">
        <div class="section-head">
          <h2>الأجندة</h2>
        </div>
        <div data-agenda></div>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="التنقل">
      <a class="nav-item" href="index.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2h-5v-6h-4v6H5a2 2 0 01-2-2V10z"/></svg></span>
        <span>الرئيسية</span>
      </a>
      <a class="nav-item" href="calendar.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span>
        <span>التقويم</span>
      </a>
      <a class="nav-item" href="map.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
        <span>الخريطة</span>
      </a>
      <a class="nav-item" href="events.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a2 2 0 012-2h14a2 2 0 012 2v2a2 2 0 100 4v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2a2 2 0 100-4z"/><path d="M12 6v12" stroke-dasharray="2 3"/></svg></span>
        <span>الفعاليات</span>
      </a>
      <a class="nav-item" href="more.html">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span>
        <span>المزيد</span>
      </a>
    </nav>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
