# Render Blueprint. See https://render.com/docs/blueprint-spec
# From the Render dashboard: New + -> Blueprint -> point at this repo.
services:
  - type: web
    name: azwa-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_ENV
        value: production
    healthCheckPath: /api/health
